<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f3f7ff",
                100: "#e6edff",
                200: "#cedcff",
                500: "#5b7cff",
                600: "#3d67ff",
                700: "#294cd8",
                900: "#101a3d",
              },
              plum: "#7c5cff",
              mint: "#4adeb8",
              ink: "#0b1120",
            },
            boxShadow: {
              luxe: "0 30px 80px rgba(52, 78, 160, 0.18)",
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      body {
        background:
          radial-gradient(
            circle at top right,
            rgba(128, 90, 213, 0.22),
            transparent 22%
          ),
          radial-gradient(
            circle at bottom left,
            rgba(42, 154, 255, 0.18),
            transparent 26%
          ),
          linear-gradient(135deg, #070b14 0%, #0d1422 28%, #090d18 100%);
        color: #edf1ff;
      }
      .glass {
        background: rgba(16, 23, 36, 0.72);
        backdrop-filter: blur(16px);
      }
      .panel {
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }
      .panel:hover {
        transform: translateY(-4px);
        border-color: rgba(173, 181, 255, 0.35);
      }
    </style>
  </head>
  <body class="antialiased">
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
      <div
        class="absolute left-[-12%] top-10 h-80 w-80 rounded-full bg-violet-500/20 blur-3xl"
      ></div>
      <div
        class="absolute right-[-8%] bottom-12 h-96 w-96 rounded-full bg-sky-500/15 blur-3xl"
      ></div>
    </div>

    <div
      class="relative mx-auto grid min-h-screen max-w-7xl items-center gap-10 px-4 py-10 lg:grid-cols-2 lg:px-8"
    >
      <div
        class="relative hidden overflow-hidden rounded-[34px] border border-white/10 bg-[#0b1220]/80 p-8 shadow-[0_40px_90px_rgba(2,6,23,0.8)] backdrop-blur-xl lg:block"
      >
        <div
          class="absolute -right-12 top-10 h-40 w-40 rounded-full bg-violet-500/20 blur-3xl"
        ></div>
        <div
          class="absolute -left-8 bottom-10 h-44 w-44 rounded-full bg-sky-500/15 blur-3xl"
        ></div>

        <div class="relative">
          <div class="flex items-center gap-3">
            <div
              class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 via-violet-500 to-indigo-500 text-white shadow-lg shadow-violet-500/20"
            >
              <i data-lucide="check-check"></i>
            </div>
            <div class="text-2xl font-black text-white">TaskFlow</div>
          </div>

          <div
            class="mt-8 rounded-[30px] border border-white/10 bg-gradient-to-br from-[#101a2d] via-[#0d1528] to-[#171d34] p-6 text-white shadow-[0_28px_60px_rgba(16,26,61,0.55)]"
          >
            <div class="flex items-center justify-between">
              <div>
                <div class="text-xs uppercase tracking-[0.24em] text-slate-300">
                  Weekly focus
                </div>
                <div class="mt-2 text-4xl font-black">74%</div>
              </div>
              <div
                class="rounded-full border border-emerald-400/40 bg-emerald-400/10 px-3 py-1.5 text-xs font-bold text-emerald-300"
              >
                On track
              </div>
            </div>

            <div class="mt-8 flex items-center justify-center">
              <div
                class="relative flex h-36 w-36 items-center justify-center rounded-full bg-[conic-gradient(#7c5cff_0_74%,rgba(255,255,255,0.12)_74%_100%)] shadow-[0_20px_30px_rgba(91,124,255,0.35)]"
              >
                <div
                  class="flex h-24 w-24 items-center justify-center rounded-full bg-[#0b1220] text-2xl font-black text-white"
                >
                  74%
                </div>
              </div>
            </div>

            <div class="mt-8 space-y-4">
              <div>
                <div class="mb-2 flex justify-between text-sm text-slate-300">
                  <span>Completed</span><span>18/24</span>
                </div>
                <div class="h-2.5 rounded-full bg-white/10">
                  <div
                    class="h-2.5 w-[75%] rounded-full bg-gradient-to-r from-violet-400 to-indigo-400"
                  ></div>
                </div>
              </div>
              <div>
                <div class="mb-2 flex justify-between text-sm text-slate-300">
                  <span>Projects</span><span>6 active</span>
                </div>
                <div class="h-2.5 rounded-full bg-white/10">
                  <div
                    class="h-2.5 w-[62%] rounded-full bg-gradient-to-r from-blue-400 to-violet-500"
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-8 grid grid-cols-2 gap-4">
            <div
              class="rounded-2xl border border-white/10 bg-white/5 p-4 shadow-sm"
            >
              <div class="text-xs uppercase tracking-[0.2em] text-slate-400">
                Tasks today
              </div>
              <div class="mt-2 text-3xl font-black text-white">12</div>
            </div>
            <div
              class="rounded-2xl border border-white/10 bg-white/5 p-4 shadow-sm"
            >
              <div class="text-xs uppercase tracking-[0.2em] text-slate-400">
                Streak
              </div>
              <div class="mt-2 text-3xl font-black text-white">9 days</div>
            </div>
          </div>
        </div>
      </div>

      <div
        class="panel mx-auto w-full max-w-lg rounded-[34px] border border-white/10 bg-[#0c1321]/80 p-8 shadow-[0_40px_80px_rgba(2,6,23,0.92)] backdrop-blur-xl"
      >
        <div class="text-center">
          <p
            class="text-sm font-bold uppercase tracking-[0.22em] text-violet-300"
          >
            Welcome back
          </p>
          <h1 class="mt-3 text-4xl font-black tracking-tight text-white">
            Log in
          </h1>
        </div>

        <form id="loginForm" class="mt-8 space-y-5">
          <div>
            <label class="mb-2 block text-sm font-medium text-slate-300"
              >Email address</label
            >
            <input
              name="email"
              type="email"
              placeholder="you@example.com"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-base text-white outline-none transition placeholder:text-slate-400 focus:border-violet-400 focus:bg-[#111b2d]"
              required
            />
          </div>

          <div>
            <div class="mb-2 flex items-center justify-between">
              <label class="text-sm font-medium text-slate-300">Password</label>
              <a href="#" class="text-sm font-medium text-violet-300"
                >Forgot password?</a
              >
            </div>
            <input
              name="password"
              type="password"
              placeholder="Enter your password"
              class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-base text-white outline-none transition placeholder:text-slate-400 focus:border-violet-400 focus:bg-[#111b2d]"
              required
            />
          </div>

          <div
            id="loginMessage"
            class="hidden rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm"
          ></div>

          <button
            type="submit"
            class="w-full rounded-2xl bg-gradient-to-r from-violet-500 via-indigo-500 to-blue-500 px-4 py-3 text-base font-semibold text-white shadow-lg shadow-violet-500/20 transition hover:scale-[1.01]"
          >
            Sign in
          </button>
        </form>

        <div class="mt-6 flex items-center gap-3 text-sm text-slate-400">
          <div class="h-px flex-1 bg-white/10"></div>
          <span>or continue with</span>
          <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-3">
          <button
            class="flex items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 font-medium text-slate-200 shadow-sm"
          >
            <i data-lucide="chrome" class="h-4 w-4"></i> Google
          </button>
          <button
            class="flex items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 font-medium text-slate-200 shadow-sm"
          >
            <i data-lucide="github" class="h-4 w-4"></i> GitHub
          </button>
        </div>

        <p class="mt-8 text-center text-sm text-slate-400">
          New here?
          <a href="signup.html" class="font-semibold text-violet-300"
            >Create an account</a
          >
        </p>
      </div>
    </div>

    <script>
      lucide.createIcons();
      gsap.from(".panel", {
        opacity: 0,
        x: 20,
        y: 18,
        duration: 0.7,
        ease: "power2.out",
      });

      const loginForm = document.getElementById("loginForm");
      const loginMessage = document.getElementById("loginMessage");

      const showMessage = (element, text, type = "error") => {
        element.textContent = text;
        element.classList.remove(
          "hidden",
          "border-red-500/30",
          "bg-red-500/10",
          "text-red-200",
          "border-emerald-500/30",
          "bg-emerald-500/10",
          "text-emerald-200",
        );
        if (type === "success") {
          element.classList.add(
            "border-emerald-500/30",
            "bg-emerald-500/10",
            "text-emerald-200",
          );
        } else {
          element.classList.add(
            "border-red-500/30",
            "bg-red-500/10",
            "text-red-200",
          );
        }
        element.classList.remove("hidden");
      };

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(loginForm);
        const payload = {
          email: formData.get("email"),
          password: formData.get("password"),
        };

        try {
          const response = await fetch(
            "http://localhost:5000/api/v1/users/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Login failed");
          }

          showMessage(
            loginMessage,
            "Login successful. Redirecting...",
            "success",
          );
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } catch (error) {
          showMessage(
            loginMessage,
            error.message || "Login failed. Please try again.",
            "error",
          );
        }
      });
    </script>
  </body>
</html>
